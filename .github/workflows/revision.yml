# Revisión automática: en cada PR abre las páginas en un navegador y marca ❌
# si alguna truena al cargar. Si sale ❌, NO se le da merge.
name: Revisión automática
on:
  pull_request:
  workflow_dispatch:
jobs:
  carga:
    name: Las páginas cargan sin errores
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar navegador
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Abrir páginas
        run: node .github/smoke/smoke.js index.html
